name: build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call: # from hermes-update.yml: build and test a newer Hermes before proposing it
    inputs:
      hermes_commit:
        description: Hermes commit to build instead of the one in HERMES_COMMIT
        type: string
        required: false
  schedule:
    - cron: "0 6 * * 1" # weekly: the pinned Hermes still builds and every demo still passes

jobs:
  demos:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      HERMES_SRC_DIR: ${{ github.workspace }}/.hermes/src
      HERMES_BUILD_DIR: ${{ github.workspace }}/.hermes/build
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -q && sudo apt-get install -y -q ninja-build; else brew install ninja; fi
          cmake --version

      - name: Use the Hermes commit given by the caller
        if: inputs.hermes_commit != ''
        run: echo "${{ inputs.hermes_commit }}" > HERMES_COMMIT

      - name: Cache the Hermes build
        uses: actions/cache@v4
        with:
          path: .hermes
          key: hermes-${{ runner.os }}-${{ hashFiles('HERMES_COMMIT', 'scripts/build-hermes.sh') }}

      - name: Build Hermes (pinned in HERMES_COMMIT)
        run: scripts/build-hermes.sh

      - name: Build the demos
        run: scripts/build.sh

      - name: Run the demos and check their output
        run: scripts/test.sh
